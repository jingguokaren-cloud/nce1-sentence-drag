        }

        // 切换单词池显示/隐藏
        let wordsHidden = false;
        function toggleWordPool() {
            const pool = document.getElementById('wordPool');
            const btn = document.getElementById('toggleWords');
            wordsHidden = !wordsHidden;

            if (wordsHidden) {
                pool.style.visibility = 'hidden';
                btn.classList.add('hidden-mode');
                btn.innerHTML = '🐵 显示单词';
            } else {
                pool.style.visibility = 'visible';
                btn.classList.remove('hidden-mode');
                btn.innerHTML = '🙈 隐藏单词';
            }
        }

        // 播放语法讲解
        function speakGrammar(text) {
            // 移除HTML标签
            const cleanText = text.replace(/<[^>]*>/g, '');
            speakPhrase(cleanText);
        }

        // 答对后下一题
        function goToNextAfterCorrect() {
            currentIndex++;
            if (currentIndex >= sentences.length) {
                showCompletion();
            } else {
                loadExercise(currentIndex);
                updateNavButtons();
            }
        }

        // 上一句
        function prevExercise() {
            if (currentIndex > 0) {
                currentIndex--;
                loadExercise(currentIndex);
                updateNavButtons();
            }
        }

        // 下一句（导航用）
        function navNextExercise() {
            if (currentIndex < sentences.length - 1) {
                currentIndex++;
                loadExercise(currentIndex);
                updateNavButtons();
            }
        }

        // 更新导航按钮状态
        function updateNavButtons() {
            document.getElementById('btnPrev').disabled = currentIndex === 0;
            document.getElementById('btnNavNext').disabled = currentIndex === sentences.length - 1;
        }

        // 跳转到指定句子
        function jumpToSentence() {
            const input = document.getElementById('jumpInput');
            let num = parseInt(input.value);
            if (isNaN(num) || num < 1) num = 1;
            if (num > sentences.length) num = sentences.length;
            input.value = num;
            currentIndex = num - 1;
            loadExercise(currentIndex);
            updateNavButtons();
        }

        // 显示完成界面
        function showCompletion() {
            document.getElementById('exerciseArea').style.display = 'none';
            document.getElementById('completionScreen').style.display = 'block';
            document.getElementById('finalScore').textContent = score;
            document.getElementById('progressFill').style.width = '100%';
            updateLessonNavButtons();
            showLessonGrammar(); // 显示语法总结
        }

        // 显示语法弹窗
        function showGrammarModal() {
            const lesson = lessonsData[currentLesson];
            const modalBody = document.getElementById('grammarModalBody');

            if (lesson.coreGrammar && lesson.coreGrammar.length > 0) {
                let html = '';
                lesson.coreGrammar.forEach(grammar => {
                    let examplesHtml = '';
                    if (grammar.examples && grammar.examples.length > 0) {
                        grammar.examples.forEach(ex => {
                            examplesHtml += `
                                <div class="grammar-example">
                                    <span class="example-en">${ex.en}</span>
                                    <span class="example-cn">${ex.cn}</span>
                                    ${ex.answer ? `<span class="example-answer">→ ${ex.answer}</span>` : ''}
                                </div>
                            `;
                        });
                    }
                    html += `
                        <div class="grammar-point">
                            <div class="grammar-point-title">📖 ${grammar.topic}</div>
                            <div class="grammar-point-content">
                                <div class="grammar-explanation">${grammar.explanation}</div>
                                <div class="grammar-examples">${examplesHtml}</div>
                            </div>
                        </div>
                    `;
                });
                modalBody.innerHTML = html;
            } else {
                modalBody.innerHTML = '<p style="text-align:center;color:#6b7280;">本课暂无语法讲解</p>';
            }

            document.getElementById('grammarModal').style.display = 'flex';
        }

        // 关闭语法弹窗
        function closeGrammarModal() {
            document.getElementById('grammarModal').style.display = 'none';
        }

        // 显示本课语法总结
        function showLessonGrammar() {
            const lesson = lessonsData[currentLesson];
            const container = document.getElementById('grammarPointsContainer');

            // 优先检查新的 coreGrammar 格式
            if (lesson.coreGrammar && lesson.coreGrammar.length > 0) {
                let html = '';
                lesson.coreGrammar.forEach(grammar => {
                    // 构建例句HTML
                    let examplesHtml = '';
                    if (grammar.examples && grammar.examples.length > 0) {
                        grammar.examples.forEach(ex => {
                            examplesHtml += `
                                <div class="grammar-example">
                                    <span class="example-en">${ex.en}</span>
                                    <span class="example-cn">${ex.cn}</span>
                                    ${ex.answer ? `<span class="example-answer">→ ${ex.answer}</span>` : ''}
                                </div>
                            `;
                        });
                    }

                    html += `
                        <div class="grammar-point">
                            <div class="grammar-point-title">
                                <button class="btn-speak-grammar" onclick="speakGrammar('${grammar.topic.replace(/'/g, "\\'").replace(/"/g, '&quot;')}')"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>
                                📖 ${grammar.topic}
                            </div>
                            <div class="grammar-point-content">
                                <div class="grammar-explanation">${grammar.explanation}</div>
                                <div class="grammar-examples">${examplesHtml}</div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
                document.getElementById('grammarSummary').style.display = 'block';
            } else if (lesson.lessonGrammar && lesson.lessonGrammar.points) {
                // 兼容旧的 lessonGrammar 格式
                let html = '';
                lesson.lessonGrammar.points.forEach(point => {
                    html += `
                        <div class="grammar-point">
                            <div class="grammar-point-title">
                                <button class="btn-speak-grammar" onclick="speakGrammar('${point.content.replace(/'/g, "\\'").replace(/"/g, '&quot;')}')"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>
                                ${point.name}
                            </div>
                            <div class="grammar-point-content">${point.content}</div>
                        </div>
                    `;
                });
                container.innerHTML = html;
                document.getElementById('grammarSummary').style.display = 'block';
            } else {
                // 从句子中提取语法点
                const grammarPoints = [];
                sentences.forEach((s, idx) => {
                    if (s.grammar) {
                        grammarPoints.push({
                            name: `第${idx + 1}句`,
                            content: s.grammar
                        });
                    }
                });

                if (grammarPoints.length > 0) {
                    let html = '';
                    grammarPoints.forEach(point => {
                        html += `
                            <div class="grammar-point">
                                <div class="grammar-point-title">
                                    <button class="btn-speak-grammar" onclick="speakGrammar('${point.content.replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/<[^>]*>/g, '')}')"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>
                                    ${point.name}
                                </div>
                                <div class="grammar-point-content">${point.content}</div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                    document.getElementById('grammarSummary').style.display = 'block';
                } else {
                    document.getElementById('grammarSummary').style.display = 'none';
                }
            }
        }

        // 重新开始
        function restartExercise() {
            loadLesson(currentLesson);
        }

        // 上一课
        function goToPrevLesson() {
            const currentIdx = availableLessons.indexOf(currentLesson);
            if (currentIdx > 0) {
                currentLesson = availableLessons[currentIdx - 1];
                document.getElementById('lessonSelect').value = currentLesson;
                loadLesson(currentLesson);
            }
        }

        // 下一课
        function goToNextLesson() {
            const currentIdx = availableLessons.indexOf(currentLesson);
            if (currentIdx < availableLessons.length - 1) {
                currentLesson = availableLessons[currentIdx + 1];
                document.getElementById('lessonSelect').value = currentLesson;
                loadLesson(currentLesson);
            }
        }

        // 更新课程导航按钮状态
        function updateLessonNavButtons() {
            const currentIdx = availableLessons.indexOf(currentLesson);
            const btnPrev = document.getElementById('btnLessonPrev');
            const btnNext = document.getElementById('btnLessonNext');

            if (btnPrev) {
                btnPrev.disabled = currentIdx === 0;
                if (currentIdx > 0) {
                    const prevLesson = availableLessons[currentIdx - 1];
                    const prevLessonData = lessonsData[prevLesson];
                    btnPrev.innerHTML = `⬅️ Lesson ${prevLesson}: ${prevLessonData.titleCn}`;
                } else {
                    btnPrev.innerHTML = '⬅️ 上一课';
                }
            }

            if (btnNext) {
                btnNext.disabled = currentIdx === availableLessons.length - 1;
                if (currentIdx < availableLessons.length - 1) {
                    const nextLesson = availableLessons[currentIdx + 1];
                    const nextLessonData = lessonsData[nextLesson];
                    btnNext.innerHTML = `Lesson ${nextLesson}: ${nextLessonData.titleCn} ➡️`;
                } else {
                    btnNext.innerHTML = '下一课 ➡️';
                }
            }
        }

        // ===== 收藏夹功能 =====

        // 获取收藏列表
        function getFavorites() {
            try {
                return JSON.parse(localStorage.getItem(favoritesStorageKey) || '[]');
            } catch { return []; }
        }

        // 保存收藏列表
        function saveFavorites(favs) {
            localStorage.setItem(favoritesStorageKey, JSON.stringify(favs));
            updateFavoritesBadge();
            if (cloudSync) cloudSync.queueSync();
        }

        // 检查是否已收藏
        function isFavorited(lesson, index) {
            return getFavorites().some(f => f.lesson === lesson && f.index === index);
        }

        // 添加收藏
        function addFavorite(lesson, index) {
            const favs = getFavorites();
            if (!favs.some(f => f.lesson === lesson && f.index === index)) {
                favs.push({ lesson, index });
                saveFavorites(favs);
            }
        }

        // 移除收藏
        function removeFavorite(lesson, index) {
            const favs = getFavorites().filter(f => !(f.lesson === lesson && f.index === index));
            saveFavorites(favs);
        }

        // 切换收藏
        function toggleFavorite() {
            const lesson = favoritesMode ? favoriteSentences[currentIndex].lesson : currentLesson;
            const sentenceIdx = favoritesMode ? favoriteSentences[currentIndex].index : currentIndex;

            if (isFavorited(lesson, sentenceIdx)) {
                removeFavorite(lesson, sentenceIdx);
                showToast('已取消收藏', 'success');
            } else {
                addFavorite(lesson, sentenceIdx);
                showToast('⭐ 已收藏', 'info');
            }
            updateFavoriteButton();
        }

        // 更新收藏按钮 UI
        function updateFavoriteButton() {
            const btn = document.getElementById('btnFavorite');
            if (!btn) return;
            const lesson = favoritesMode ? favoriteSentences[currentIndex].lesson : currentLesson;
            const sentenceIdx = favoritesMode ? favoriteSentences[currentIndex].index : currentIndex;

            if (isFavorited(lesson, sentenceIdx)) {
                btn.classList.add('active');
                btn.textContent = '★ 已收藏';
            } else {
                btn.classList.remove('active');
                btn.textContent = '☆ 收藏';
            }
        }

        // 更新收藏夹角标
        function updateFavoritesBadge() {
            const badge = document.getElementById('favoritesBadge');
            if (!badge) return;
            const count = getFavorites().length;
            badge.textContent = count;
            badge.classList.toggle('empty', count === 0);
        }

        // 切换收藏夹模式
        function toggleFavoritesMode() {
            if (favoritesMode) {
                exitFavoritesMode();
            } else {
                enterFavoritesMode();
            }
        }

        // 进入收藏夹模式
        function enterFavoritesMode() {
            const favs = getFavorites();
            if (favs.length === 0) {
                showToast('收藏夹为空，快去收藏句子吧！', 'info');
                return;
            }

            favoritesMode = true;
            favoriteSentences = favs;

            // 构建收藏句子列表
            sentences = favs.map(f => {
                const lessonData = lessonsData[f.lesson];
                if (lessonData && lessonData.sentences[f.index]) {
                    return lessonData.sentences[f.index];
                }
                return null;
            }).filter(s => s !== null);

            // 同步过滤 favoriteSentences（移除无效项）
            favoriteSentences = favs.filter(f => {
                const lessonData = lessonsData[f.lesson];
                return lessonData && lessonData.sentences[f.index];
            });

            if (sentences.length === 0) {
                showToast('收藏的句子数据已失效', 'info');
                favoritesMode = false;
                return;
            }

            currentIndex = 0;
            score = 0;

            document.getElementById('score').textContent = 0;
            document.getElementById('totalCount').textContent = sentences.length;
            document.getElementById('finalTotal').textContent = sentences.length;
            document.getElementById('exerciseArea').style.display = 'block';
            document.getElementById('completionScreen').style.display = 'none';

            // 更新 UI 状态
            document.getElementById('btnFavoritesMode').classList.add('active');
            document.getElementById('lessonSelect').disabled = true;

            loadExercise(0);
            updateNavButtons();
        }

        // 退出收藏夹模式
        function exitFavoritesMode() {
            favoritesMode = false;
            favoriteSentences = [];

            document.getElementById('btnFavoritesMode').classList.remove('active');
            document.getElementById('lessonSelect').disabled = false;

            loadLesson(currentLesson);
        }

        // Toast 提示
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        // 收藏夹逻辑
        function showFavoritesShelf() {
            const favs = getFavorites();
            const body = document.getElementById('favoritesShelfBody');
            if (favs.length === 0) {
                body.innerHTML = '<p style="text-align:center; padding: 40px 20px; color:#6b7280;">您的收藏夹是空的，遇到好句子可以点击"☆ 收藏"保存哦。</p>';
            } else {
                let html = '';
                favs.forEach((f) => {
                    const lessonData = lessonsData[f.lesson];
                    if (lessonData && lessonData.sentences[f.index]) {
                        const s = lessonData.sentences[f.index];
                        html += `
                            <div class="fav-shelf-item">
                                <div class="fav-shelf-en">${s.english}</div>
                                <div class="fav-shelf-cn">${s.chinese || ''}</div>
                                <div class="fav-shelf-actions">
                                    <button class="fav-shelf-btn" onclick="speakPhrase('${s.english.replace(/'/g, "\\'")}')">🔊 发音</button>
                                    <button class="fav-shelf-btn" onclick="copyShelfSentence('${s.english.replace(/'/g, "\\'").replace(/"/g, '&quot;')}')">📄 复制并提问AI</button>
                                    <button class="fav-shelf-btn" style="color:#ef4444;" onclick="removeFromShelf(${f.lesson}, ${f.index})">🗑️ 移除</button>
                                </div>
                            </div>
                        `;
                    }
                });
                body.innerHTML = html;
            }
            document.getElementById('favoritesShelfModal').style.display = 'flex';
        }

        function closeFavoritesShelf() {
            document.getElementById('favoritesShelfModal').style.display = 'none';
        }

        function copyShelfSentence(sentenceText) {
            const prompt = sentenceText + " 请帮我细分析这句话的语法结构。";
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(prompt).then(() => {
                    showToast('✅ 复制成功！可以去AI提问啦', 'success');
                }).catch(err => {
                    fallbackCopyTextToClipboard(prompt);
                });
            } else {
                fallbackCopyTextToClipboard(prompt);
            }
        }

        function removeFromShelf(lesson, index) {
            removeFavorite(lesson, index);
            showFavoritesShelf();
            updateFavoriteButton();
        }

        // ------------------ 生词本逻辑 ------------------
        function normalizeVocabWord(word) {
            return String(word || '').replace(/’/g, "'").trim();
        }

        function getCurrentSentenceVocabCandidates() {
            const sentence = sentences[currentIndex];
            const matches = sentence?.english?.match(/[A-Za-z]+(?:['’][A-Za-z]+)*/g) || [];
            const seen = new Set();
            return matches
                .map(normalizeVocabWord)
                .filter(word => {
                    const key = word.toLowerCase();
                    if (!key || seen.has(key)) return false;
                    seen.add(key);
                    return true;
                });
        }

        function isVocabWordSaved(word, savedWords = getVocabWords()) {
            const key = normalizeVocabWord(word).toLowerCase();
            return savedWords.some(savedWord => normalizeVocabWord(savedWord).toLowerCase() === key);
        }

        function markVocabPickerWordSaved(button, word) {
            button.classList.add('saved');
            button.disabled = true;
            button.textContent = `✓ ${word}`;
            button.setAttribute('aria-label', `${word}，已收藏`);
        }

        function renderVocabPicker() {
            const container = document.getElementById('vocabPickerWords');
            const candidates = getCurrentSentenceVocabCandidates();
            const savedWords = getVocabWords();
            container.innerHTML = '';

            if (candidates.length === 0) {
                container.innerHTML = '<p class="vocab-picker-empty">本句没有可收藏的英文单词。</p>';
                return;
            }

            candidates.forEach(word => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'vocab-picker-word';

                if (isVocabWordSaved(word, savedWords)) {
                    markVocabPickerWordSaved(button, word);
                } else {
                    button.textContent = `＋ ${word}`;
                    button.setAttribute('aria-label', `收藏单词 ${word}`);
                    button.addEventListener('click', () => {
                        const latestWords = getVocabWords();
                        if (!isVocabWordSaved(word, latestWords)) {
                            latestWords.push(word);
                            saveVocabWords(latestWords);
                            showToast(`✅ 成功收藏生词: ${word}`, 'success');
                        }
                        markVocabPickerWordSaved(button, word);
                    });
                }
                container.appendChild(button);
            });
        }

        function showVocabPicker() {
            renderVocabPicker();
            const modal = document.getElementById('vocabPickerModal');
            modal.style.display = 'flex';
            modal.querySelector('.vocab-picker-word:not(:disabled), .btn-close-modal')?.focus();
        }

        function closeVocabPicker() {
            document.getElementById('vocabPickerModal').style.display = 'none';
        }

        function getVocabWords() {
            try {
                return JSON.parse(localStorage.getItem(vocabStorageKey) || '[]');
            } catch { return []; }
        }

        function saveVocabWords(words) {
            localStorage.setItem(vocabStorageKey, JSON.stringify(words));
            if (cloudSync) cloudSync.queueSync();
        }

        function getCloudState() {
            const snapshot = { lesson: currentLesson, index: currentIndex, favoritesMode, favorites: getFavorites(), vocab: getVocabWords(), audioPadding: loadAudioPaddingSettings(), updatedAt: Date.now() };
            if (activeStorageKey) localStorage.setItem(activeStorageKey, JSON.stringify(snapshot));
            return snapshot;
        }
        function applyCloudState(next = {}) {
            currentLesson = Number(next.lesson) || currentLesson;
            currentIndex = Math.max(0, Number(next.index) || 0);
            favoritesMode = Boolean(next.favoritesMode);
            localStorage.setItem(favoritesStorageKey, JSON.stringify(next.favorites || []));
            localStorage.setItem(vocabStorageKey, JSON.stringify(next.vocab || []));
            localStorage.setItem(audioPaddingStorageKey, JSON.stringify(next.audioPadding || {}));
            initLessonSelector();
            loadLesson(currentLesson);
            updateFavoritesBadge();
        }
        function activateStudentStorage(identity) {
            const key = String(identity.userId || identity.username || 'student').trim().toLowerCase().replace(/[^a-z0-9_.:-]/g, '-');
            activeStorageKey = `nce1-sentence-drag-v1:${key}`;
            favoritesStorageKey = `${activeStorageKey}:favorites`;
            vocabStorageKey = `${activeStorageKey}:vocab`;
            audioPaddingStorageKey = `${activeStorageKey}:audio-padding`;
            let saved = {};
            try { saved = JSON.parse(localStorage.getItem(activeStorageKey) || '{}'); } catch { saved = {}; }
            applyCloudState(saved);
        }
        function deactivateStudentStorage() { activeStorageKey = ''; favoritesStorageKey = 'nce1_favorites'; vocabStorageKey = 'nce1_vocab'; audioPaddingStorageKey = 'nce1_audio_end_padding_by_lesson'; }
        async function initializeCloudSync() {
            try {
                const { createCloudSync } = await import('./cloud-sync.js?v=20260804-cloudbase');
                cloudSync = await createCloudSync({ appId: 'nce1-sentence-drag', storageKey: 'nce1-sentence-drag-v1', getState: getCloudState, applyState: applyCloudState, getSummary: () => ({ lesson: currentLesson, index: currentIndex, favorites: getFavorites().length, vocab: getVocabWords().length }), onAuthenticated: activateStudentStorage, onSignedOut: deactivateStudentStorage });
            } catch (error) { console.error('CloudBase 初始化失败', error); }
        }

        function showVocabShelf() {
            const words = getVocabWords();
            const body = document.getElementById('vocabShelfBody');
            if (words.length === 0) {
                body.innerHTML = '<p style="text-align:center; padding: 40px 20px; color:#6b7280;">您的生词本是空的。点击页面上的“📌 收藏生词”，从当前句子中选择单词即可保存。</p>';
            } else {
                let html = '<div style="padding: 15px; display: flex; flex-wrap: wrap; gap: 10px;">';
                words.forEach((w) => {
                    html += `
                        <div class="word" style="cursor:default; display:flex; align-items:center; gap:8px; padding-right:10px;">
                            <span style="user-select:text;">${w}</span>
                            <span onclick="speakPhrase('${w.replace(/'/g, "\\'")}')" style="cursor:pointer; opacity:0.8;">🔊</span>
                            <span onclick="removeVocabWord('${w.replace(/'/g, "\\'").replace(/"/g, '&quot;')}')" style="cursor:pointer; color:#ef4444; font-weight:bold; margin-left:4px;">×</span>
                        </div>
                    `;
                });
                html += '</div>';
                body.innerHTML = html;
            }
            document.getElementById('vocabShelfModal').style.display = 'flex';
        }

        function closeVocabShelf() {
            document.getElementById('vocabShelfModal').style.display = 'none';
        }

        function removeVocabWord(word) {
            const words = getVocabWords().filter(w => w !== word);
            saveVocabWords(words);
            showVocabShelf();
        }

        // 启动
        init();
        initializeCloudSync();
    </script>
</body>

</html>
