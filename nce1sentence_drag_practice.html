<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>新概念英语第一册 - 句子重组练习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 消除手机端 300ms 点击延迟 */
        button, .btn, .word, .btn-favorites-mode, .btn-speak-sentence,
        .toggle-chinese, .btn-copy-sentence, .btn-show-answer,
        .speak-icon, select, a {
            touch-action: manipulation;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.2em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        /* 课程选择器样式 */
        .lesson-selector {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
        }

        .lesson-selector label {
            color: white;
            font-size: 1.1em;
            font-weight: 600;
        }

        .lesson-select {
            padding: 12px 20px;
            font-size: 1em;
            border: none;
            border-radius: 25px;
            background: white;
            color: #374151;
            cursor: pointer;
            min-width: 280px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .lesson-select:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        .lesson-select:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.5);
        }

        .audio-padding-control {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 9px 14px;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 24px;
        }

        .audio-padding-control label {
            font-size: 0.95em;
            white-space: nowrap;
        }

        .audio-padding-slider {
            width: 130px;
            cursor: pointer;
            accent-color: #10b981;
        }

        .audio-padding-value {
            min-width: 58px;
            color: white;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .progress-bar {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            height: 12px;
            margin: 20px auto;
            max-width: 400px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #00f260, #0575e6);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 20px;
        }

        .score-display {
            color: white;
            font-size: 1.2em;
            margin-top: 10px;
        }

        .jump-input {
            width: 42px;
            text-align: center;
            background: rgba(255,255,255,0.25);
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 6px;
            color: white;
            font-size: 0.8em;
            font-weight: bold;
            padding: 2px 4px;
            outline: none;
            touch-action: manipulation;
        }

        .jump-input:focus {
            background: rgba(255,255,255,0.45);
            border-color: white;
        }

        .jump-input::-webkit-outer-spin-button,
        .jump-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .jump-input[type=number] {
            -moz-appearance: textfield;
        }

        .exercise-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .speaker-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .speaker-sam {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
        }

        .speaker-penny {
            background: linear-gradient(135deg, #ec4899, #be185d);
            color: white;
        }

        .chinese-hint {
            color: #6b7280;
            font-size: 0.95em;
            margin-bottom: 20px;
            padding: 10px 15px;
            background: #f3f4f6;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        /* 讲解区域样式 */
        .explanation-area {
            margin-top: 20px;
            display: none;
        }

        .explanation-card {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 12px;
            border-left: 4px solid;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .grammar-card {
            border-left-color: #8b5cf6;
        }

        .phrases-card {
            border-left-color: #10b981;
        }

        .explanation-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 1em;
            margin-bottom: 10px;
        }

        .grammar-card .explanation-title {
            color: #7c3aed;
        }

        .phrases-card .explanation-title {
            color: #059669;
        }

        .explanation-content {
            color: #374151;
            font-size: 0.95em;
            line-height: 1.7;
        }

        .explanation-content strong {
            color: #1f2937;
            background: linear-gradient(120deg, #fef3c7 0%, #fde68a 100%);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .phrase-item {
            padding: 8px 12px;
            background: white;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #e5e7eb;
        }

        .phrase-item:last-child {
            margin-bottom: 0;
        }

        .phrase-en {
            font-weight: 600;
            color: #1f2937;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .phrase-cn {
            color: #6b7280;
            font-size: 0.9em;
            margin-top: 4px;
        }

        /* 句子控制区域 */
        .sentence-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .btn-speak-sentence {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s ease;
        }

        .btn-speak-sentence:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .toggle-chinese {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: #f3f4f6;
            border: 2px solid #e5e7eb;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s ease;
        }

        .toggle-chinese:hover {
            border-color: #9ca3af;
        }

        .toggle-chinese.hidden-mode {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border-color: transparent;
        }

        .btn-copy-sentence {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s ease;
        }

        .btn-copy-sentence:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
        }

        .btn-show-answer {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s ease;
        }

        .btn-show-answer:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }

        .chinese-hint.hidden {
            visibility: hidden;
            opacity: 0;
        }

        /* 语法总结区域样式 */
        .grammar-summary {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border-radius: 15px;
            padding: 25px;
            margin-top: 25px;
            text-align: left;
        }

        .grammar-summary h3 {
            color: #92400e;
            font-size: 1.3em;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .grammar-point {
            background: white;
            border-radius: 12px;
            padding: 15px 18px;
            margin-bottom: 12px;
            border-left: 4px solid #f59e0b;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .grammar-point:last-child {
            margin-bottom: 0;
        }

        /* 新的语法讲解样式 */
        .grammar-explanation {
            color: #374151;
            font-size: 0.95em;
            line-height: 1.6;
            margin-bottom: 12px;
            padding: 10px;
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border-radius: 8px;
        }

        .grammar-examples {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .grammar-example {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            background: #f9fafb;
            border-radius: 8px;
            border-left: 3px solid #10b981;
        }

        .example-en {
            font-weight: 600;
            color: #1f2937;
            font-size: 0.95em;
        }

        .example-cn {
            color: #6b7280;
            font-size: 0.9em;
        }

        .example-answer {
            color: #059669;
            font-weight: 500;
            font-size: 0.9em;
            background: #d1fae5;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .grammar-point-title {
            font-weight: 600;
            color: #92400e;
            font-size: 1em;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .grammar-point-content {
            color: #374151;
            font-size: 0.95em;
            line-height: 1.7;
        }

        .btn-speak-grammar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 50%;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-speak-grammar:hover {
            transform: scale(1.1);
            box-shadow: 0 3px 10px rgba(245, 158, 11, 0.4);
        }

        .btn-speak-grammar svg {
            width: 14px;
            height: 14px;
            fill: white;
        }

        /* 发音图标样式 */
        .speak-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .speak-icon:hover {
            transform: scale(1.1);
            box-shadow: 0 2px 10px rgba(59, 130, 246, 0.4);
        }

        .speak-icon:active {
            transform: scale(0.95);
        }

        .speak-icon svg {
            width: 14px;
            height: 14px;
            fill: white;
        }

        .speak-icon.playing {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }
        }

        /* 单词发音提示 */
        .word {
            position: relative;
        }

        .word::after {
            content: '🔊';
            position: absolute;
            right: -8px;
            top: -8px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .word:hover::after {
            opacity: 1;
        }

        .drop-zone {
            min-height: 60px;
            border: 3px dashed #d1d5db;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            background: #fafafa;
            transition: all 0.3s ease;
        }

        .drop-zone.drag-over {
            border-color: #667eea;
            background: #f0f4ff;
            transform: scale(1.02);
        }

        .drop-zone.correct {
            border-color: #10b981;
            background: #ecfdf5;
            border-style: solid;
        }

        .drop-zone.wrong {
            border-color: #ef4444;
            background: #fef2f2;
            animation: shake 0.5s ease;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }

        .word-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            padding: 15px;
            background: #f8fafc;
            border-radius: 15px;
            min-height: 50px;
        }

        .word {
            padding: 10px 18px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 25px;
            cursor: grab;
            font-size: 1em;
            font-weight: 500;
            transition: all 0.2s ease;
            user-select: none;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .word:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .word:active {
            cursor: grabbing;
            transform: scale(0.95);
        }

        .word.dragging {
            opacity: 0.5;
        }

        #dropZone.correct .word {
            user-select: text;
            cursor: text;
        }

        .word.in-zone {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-check {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .btn-check:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-reset {
            background: linear-gradient(135deg, #6b7280, #4b5563);
            color: white;
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(107, 114, 128, 0.4);
        }

        .btn-grammar {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }

        .btn-grammar:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(245, 158, 11, 0.4);
        }

        /* 语法弹窗样式 */
        .grammar-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .grammar-modal-content {
            background: white;
            border-radius: 20px;
            max-width: 700px;
            max-height: 80vh;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
        }

        .grammar-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }

        .grammar-modal-header h3 {
            margin: 0;
            font-size: 1.3em;
        }

        .btn-close-modal {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-close-modal:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .grammar-modal-body {
            padding: 24px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .vocab-picker-content {
            max-width: 600px;
            width: 90%;
        }

        .vocab-picker-header {
            background: linear-gradient(135deg, #ec4899, #be185d);
        }

        .vocab-picker-body {
            padding: 22px;
        }

        .vocab-picker-tip {
            margin: 0 0 16px;
            color: #4b5563;
            line-height: 1.6;
            text-align: center;
        }

        .vocab-picker-words {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .vocab-picker-word {
            padding: 10px 16px;
            border: 2px solid #c4b5fd;
            border-radius: 999px;
            background: #f5f3ff;
            color: #5b21b6;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .vocab-picker-word:hover:not(:disabled) {
            transform: translateY(-2px);
            background: #ede9fe;
            box-shadow: 0 6px 16px rgba(124, 58, 237, 0.2);
        }

        .vocab-picker-word.saved {
            border-color: #10b981;
            background: #d1fae5;
            color: #047857;
            cursor: default;
            opacity: 1;
        }

        .vocab-picker-empty {
            width: 100%;
            margin: 0;
            color: #6b7280;
            text-align: center;
        }

        .fav-shelf-item {
            padding: 16px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .fav-shelf-en {
            font-size: 1.1em;
            color: #1f2937;
            font-weight: 500;
        }

        .fav-shelf-cn {
            color: #4b5563;
        }

        .fav-shelf-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .fav-shelf-btn {
            background: #f3f4f6;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            color: #4b5563;
        }

        .fav-shelf-btn:hover {
            background: #e5e7eb;
        }

        .btn-next {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
        }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(59, 130, 246, 0.4);
        }

        .btn-prev {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }

        .btn-prev:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(245, 158, 11, 0.4);
        }

        .btn-prev:disabled,
        .btn-nav-next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-nav-next {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
        }

        .btn-nav-next:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.4);
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 0 0 10px;
        }

        .nav-buttons .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 120px;
            min-height: 42px;
            padding: 10px 22px;
            border-radius: 24px;
            font-size: 1em;
        }

        .result-message {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-weight: 600;
            display: none;
        }

        .result-message.correct {
            display: block;
            background: #ecfdf5;
            color: #059669;
        }

        .result-message.wrong {
            display: block;
            background: #fef2f2;
            color: #dc2626;
        }

        .completion-screen {
            display: none;
            text-align: center;
            padding: 50px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .completion-screen h2 {
            font-size: 2em;
            color: #10b981;
            margin-bottom: 20px;
        }

        .completion-screen .emoji {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .completion-screen .final-score {
            font-size: 1.5em;
            color: #374151;

    <!-- 引入课程数据 -->
    <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.4.2/cloudbase.full.js"></script>
    <script src="nce_lessons_data.js"></script>

    <script>
        // 当前状态
        let currentLesson = 1;
        let sentences = [];
        let currentIndex = 0;
        let score = 0;
        let draggedWord = null;
        let currentWords = [];
        let favoritesMode = false;
        let favoriteSentences = []; // 收藏夹模式下的句子列表
        let autoShowAnswer = false; // 连播阅读模式
        let cloudSync = null;
        let activeStorageKey = '';
        let favoritesStorageKey = 'nce1_favorites';
        let vocabStorageKey = 'nce1_vocab';
        let audioPaddingStorageKey = 'nce1_audio_end_padding_by_lesson';

        const availableLessons = Object.keys(lessonsData).map(Number).sort((a, b) => a - b);
        const defaultAudioEndPadding = 0.3;
        function loadAudioPaddingSettings() {
            try {
                return JSON.parse(localStorage.getItem(audioPaddingStorageKey) || '{}');
            } catch {
                return {};
            }
        }

        function getLessonAudioPadding(lessonNum) {
            const savedValue = Number(loadAudioPaddingSettings()[lessonNum]);
            if (!Number.isFinite(savedValue)) return defaultAudioEndPadding;
            return Math.min(1, Math.max(-1, savedValue));
        }

        function syncAudioPaddingControl(lessonNum = currentLesson) {
            const value = getLessonAudioPadding(lessonNum);
            const slider = document.getElementById('audioPaddingSlider');
            const output = document.getElementById('audioPaddingValue');
            if (slider) slider.value = value.toFixed(2);
            if (output) output.textContent = `${value.toFixed(2)}秒`;
        }

        function updateAudioPadding(rawValue) {
            const value = Math.min(1, Math.max(-1, Number(rawValue)));
            const settings = loadAudioPaddingSettings();
            settings[currentLesson] = Number(value.toFixed(2));
            localStorage.setItem(audioPaddingStorageKey, JSON.stringify(settings));
            if (cloudSync) cloudSync.queueSync();
            document.getElementById('audioPaddingValue').textContent = `${value.toFixed(2)}秒`;
            NCEAudio.cancel();
        }

        function confirmAudioPadding() {
            const value = getLessonAudioPadding(currentLesson);
            showToast(`第${currentLesson}课句尾调整已设为 ${value.toFixed(2)} 秒`, 'success');
        }

        // 初始化课程选择器
        function initLessonSelector() {
            const select = document.getElementById('lessonSelect');
            select.innerHTML = '';
            availableLessons.forEach(lessonNum => {
                const lesson = lessonsData[lessonNum];
                const option = document.createElement('option');
                option.value = lessonNum;
                option.textContent = `Lesson ${lessonNum}: ${lesson.title} (${lesson.titleCn})`;
                select.appendChild(option);
            });
            select.value = currentLesson;
        }

        // 切换课程
        function changeLesson() {
            // 切换课程时自动退出收藏夹模式
            if (favoritesMode) exitFavoritesMode();
            const select = document.getElementById('lessonSelect');
            currentLesson = parseInt(select.value);
            loadLesson(currentLesson);
            if (cloudSync) cloudSync.queueSync();
        }

        // 加载课程
        function loadLesson(lessonNum) {
            const lesson = lessonsData[lessonNum];
            NCEAudio.cancel();
            NCEAudio.preloadLesson(lessonNum);
            syncAudioPaddingControl(lessonNum);
            sentences = lesson.sentences;
            currentIndex = 0;
            score = 0;

            document.getElementById('score').textContent = 0;
            document.getElementById('totalCount').textContent = sentences.length;
            document.getElementById('finalTotal').textContent = sentences.length;

            // 显示练习区域，隐藏完成界面
            document.getElementById('exerciseArea').style.display = 'block';
            document.getElementById('completionScreen').style.display = 'none';

            loadExercise(0);
            updateNavButtons();
        }

        // 初始化
        function init() {
            initLessonSelector();
            loadLesson(currentLesson);
            setupDragAndDrop();
            updateFavoritesBadge();
        }

        // 加载练习题
        function loadExercise(index) {
            const sentence = sentences[index];
            const badge = document.getElementById('speakerBadge');
            badge.textContent = sentence.speaker;
            badge.className = 'speaker-badge ' + sentence.speakerClass;

            document.getElementById('chineseHint').textContent = sentence.chinese;
            document.getElementById('jumpInput').value = index + 1;

            // 更新进度条
            const progress = ((index) / sentences.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            // 按字母顺序排列单词（标点符号排在最后）
            currentWords = tokenizeSentence(sentence.english).sort((a, b) => {
                const aIsPunct = /^[!?,.]+$/.test(a);
                const bIsPunct = /^[!?,.]+$/.test(b);
                if (aIsPunct && !bIsPunct) return 1;
                if (!aIsPunct && bIsPunct) return -1;
                return a.toLowerCase().localeCompare(b.toLowerCase());
            });

            // 渲染单词池
            renderWordPool();

            // 清空放置区
            const dropZone = document.getElementById('dropZone');
            dropZone.innerHTML = '<span style="color: #9ca3af; font-style: italic;">将单词拖到这里...</span>';
            dropZone.classList.remove('correct', 'wrong');

            // 隐藏结果和下一题按钮
            document.getElementById('resultMessage').className = 'result-message';
            document.getElementById('btnNext').style.display = 'none';

            // 隐藏讲解区域
            document.getElementById('explanationArea').style.display = 'none';

            // 更新收藏按钮状态
            updateFavoriteButton();

            // 如果处于连播阅读模式，直接显示答案
            if (autoShowAnswer) {
                setTimeout(() => showCorrectAnswer(), 50);
            }
        }

        // 分词函数
        function tokenizeSentence(sentence) {
            const tokens = [];
            const regex = /([a-zA-Z0-9]+['-]?[a-zA-Z0-9]*|[!?,.])/g;
            let match;
            while ((match = regex.exec(sentence)) !== null) {
                tokens.push(match[0]);
            }
            return tokens;
        }

        // 打乱数组
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // 渲染单词池
        function renderWordPool() {
            const pool = document.getElementById('wordPool');
            pool.innerHTML = '';
            currentWords.forEach((word, index) => {
                const wordEl = createWordElement(word, index);
                pool.appendChild(wordEl);
            });
        }

        // 创建单词元素
        function createWordElement(word, index) {
            const el = document.createElement('div');
            el.className = 'word';
            el.textContent = word;
            el.draggable = true;
            el.dataset.word = word;
            el.dataset.index = index;

            // 添加点击发音功能（不干扰拖拽）
            el.addEventListener('mousedown', (e) => {
                // 记录点击时间，用于区分点击和拖拽
                el.dataset.clickTime = Date.now();
            });

            el.addEventListener('mouseup', (e) => {
                const clickTime = parseInt(el.dataset.clickTime) || 0;
                const elapsed = Date.now() - clickTime;
                // 如果是快速点击（<200ms），触发发音
                if (elapsed < 200 && !isPunctuation(word)) {
                    speakWord(word);
                }
            });

            return el;
        }

        // 判断是否是标点符号
        function isPunctuation(str) {
            return /^[!?,.'"\-;:]+$/.test(str);
        }

        // 使用有道词典API发音
        function speakWord(word) {
            // 清理单词中可能的标点
            const cleanWord = word.replace(/[^a-zA-Z']/g, '');
            if (!cleanWord) return;
            phrasePlaybackId++;
            NCEAudio.cancel();

            // 停止之前的音频
            if (window.currentAudio) {
                window.currentAudio.pause();
                window.currentAudio = null;
            }

            // 有道词典API - type=1美式，type=2英式
            const audioUrl = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(cleanWord)}&type=1`;

            const audio = new Audio(audioUrl);
            window.currentAudio = audio;

            audio.play().catch(err => {
                console.log('发音加载失败:', err);

        // --- NCE Audio Integration ---
        const NCEAudio = {
          bookData: null,
          cache: {},
          
          async getBookData() {
            if (this.bookData) return this.bookData;
            try {
              const res = await fetch('https://nce.mleo.site/NCE1/book.json');
              this.bookData = await res.json();
            } catch (e) {
              console.error("NCE Book data fetch error", e);
            }
            return this.bookData;
          },

          parseLRC(text) {
            const lines = text.split('\n');
            const result = [];
            const timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
            for (const line of lines) {
               const match = line.match(timeReg);
               if (match) {
                  const min = parseInt(match[1], 10);
                  const sec = parseInt(match[2], 10);
                  const fraction = Number(`0.${match[3]}`);
                  const time = min * 60 + sec + fraction;
                  const content = line.replace(timeReg, '').trim();
                  const en = content.split('|')[0].trim();
                  result.push({ time, en, raw: line });
               }
            }
            return result;
          },

          async loadLesson(lessonNum) {
            if (this.cache[lessonNum]) return this.cache[lessonNum];
            
            const book = await this.getBookData();
            if (!book) return null;
            
            const unitIndex = Math.floor((lessonNum - 1) / 2);
            if (unitIndex < 0 || unitIndex >= book.units.length) return null;
            
            const filename = book.units[unitIndex].filename.replace(/&/g, '%26').replace(/ /g, '%20');
            const audioUrl = `https://nce.mleo.site/NCE1/${filename}.mp3`;
            const lrcUrl = `https://nce.mleo.site/NCE1/${filename}.lrc`;
            
            try {
              const res = await fetch(lrcUrl);
              if (!res.ok) throw new Error('LRC not found');
              const text = await res.text();
              const lrc = this.parseLRC(text);
              const audio = new Audio(audioUrl);
              audio.preload = 'auto';
              
              const matchedSentences = {}; 
              const lessonData = typeof lessonsData !== 'undefined' ? lessonsData[lessonNum] : null;
              if (lessonData && lessonData.sentences) {
                 let lrcIndex = 0;
                 for (const sentenceObj of lessonData.sentences) {
                    const cleanTarget = sentenceObj.english.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
                    
                    let matched = false;
                    for (let j = lrcIndex; j < lrc.length; j++) {
                       let concatenatedLrc = '';
                       for (let k = j; k < lrc.length; k++) {
                           concatenatedLrc += lrc[k].en.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
                           if (concatenatedLrc === cleanTarget) {
                              matchedSentences[sentenceObj.english] = {
                                 start: lrc[j].time,
                                 end: (k + 1 < lrc.length) ? lrc[k + 1].time : lrc[k].time + 5
                              };
                              lrcIndex = k + 1;
                              matched = true;
                              break;
                           }
                           if (concatenatedLrc.length > cleanTarget.length) {
                              break;
                           }
                       }
                       if (matched) break;
                    }
                 }
              }
              
              this.cache[lessonNum] = { audio, lrc, matchedSentences };
              return this.cache[lessonNum];
            } catch (e) {
              console.error("NCE Lesson load error", e);
              return null;
            }
          },
          
          startPaddingSeconds: 0.15,
          endGuardSeconds: 0.33,
          monitorIntervalMs: 10,
          playId: 0,

          activePlayback: null,

          stopCurrentPlayback() {
            const playback = this.activePlayback;
            if (!playback) return;

            this.activePlayback = null;
            clearInterval(playback.monitorId);
            playback.audio.removeEventListener('ended', playback.handleEnded);
            playback.audio.removeEventListener('timeupdate', playback.handleTimeUpdate);
            playback.audio.pause();
            playback.resolve('cancelled');
          },

          pauseCachedAudio() {
            Object.values(this.cache).forEach(lessonData => {
              if (!lessonData?.audio) return;
              lessonData.audio.pause();
              lessonData.audio.volume = 1;
            });
          },

          cancel() {
            this.playId++;
            this.stopCurrentPlayback();
            this.pauseCachedAudio();
          },

          startMutedPlayback(audio, currentPlayId) {
            audio.volume = 0;
            return audio.play()
              .then(() => {
                if (this.playId !== currentPlayId) {
                  audio.pause();
                  audio.volume = 1;
                  return false;
                }
                return true;
              })
              .catch(() => false);
          },

          preloadLesson(lessonNum) {

            this.loadLesson(lessonNum)

              .then(lessonData => {

                if (lessonData?.audio && lessonData.audio.readyState === 0) {

                  lessonData.audio.load();

                }

              })

              .catch(error => console.error('Audio preload error', error));

          },


          async waitForMetadata(audio) {


            if (audio.readyState >= 1) return true;



            return new Promise(resolve => {


              let timeoutId;


              const finish = (isReady) => {


                clearTimeout(timeoutId);


                audio.removeEventListener('loadedmetadata', handleLoaded);


                audio.removeEventListener('error', handleError);


                resolve(isReady);


              };


              const handleLoaded = () => finish(true);


              const handleError = () => finish(false);



              audio.addEventListener('loadedmetadata', handleLoaded, { once: true });


              audio.addEventListener('error', handleError, { once: true });


              timeoutId = setTimeout(() => finish(false), 10000);


              audio.load();


            });


          },

          async waitForSeek(audio) {
            if (!audio.seeking) return;

            await new Promise(resolve => {
              let timeoutId;
              const finish = () => {
                clearTimeout(timeoutId);
                audio.removeEventListener('seeked', finish);
                resolve();
              };

              audio.addEventListener('seeked', finish, { once: true });
              timeoutId = setTimeout(finish, 2000);
            });
          },
          
          async playSentence(text, lessonNum) {
            const currentPlayId = ++this.playId;
            this.stopCurrentPlayback();
            this.pauseCachedAudio();

            let lessonData = this.cache[lessonNum] || null;
            if (!lessonData) {
              lessonData = await this.loadLesson(lessonNum);
              if (this.playId !== currentPlayId) return 'cancelled';
            }
            if (!lessonData) return 'unavailable';
            
            let match = lessonData.matchedSentences[text];
            if (!match) {
              const cleanTarget = text.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
              let matched = false;
              for (let j = 0; j < lessonData.lrc.length; j++) {
                 let concatenatedLrc = '';
                 for (let k = j; k < lessonData.lrc.length; k++) {
                     concatenatedLrc += lessonData.lrc[k].en.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
                     if (concatenatedLrc === cleanTarget) {
                        match = {
                           start: lessonData.lrc[j].time,
                           end: (k + 1 < lessonData.lrc.length) ? lessonData.lrc[k + 1].time : lessonData.lrc[k].time + 5
                        };
                        lessonData.matchedSentences[text] = match;
                        matched = true;
                        break;
                     }
                     if (concatenatedLrc.length > cleanTarget.length) {
                        break;
                     }
                 }
                 if (matched) break;
              }
            }
            
            if (!match) return 'unavailable';
            
            const audio = lessonData.audio;
            const actualStart = Math.max(0, match.start - this.startPaddingSeconds);
            const actualEnd = Math.max(
              actualStart,
              match.end - this.endGuardSeconds + getLessonAudioPadding(lessonNum)
            );

            try {
              let playPromise;

              if (audio.readyState >= 1) {
                audio.pause();
                audio.volume = 1;
                audio.currentTime = actualStart;
                playPromise = audio.play();
              } else {
                audio.volume = 0;
                playPromise = audio.play();

                const metadataReady = await this.waitForMetadata(audio);
                if (this.playId !== currentPlayId) return 'cancelled';
                if (!metadataReady) {
                  this.playId++;
                  audio.pause();
                  audio.volume = 1;
                  return 'unavailable';
                }

                audio.currentTime = actualStart;
              }

              await this.waitForSeek(audio);
              if (this.playId !== currentPlayId) return 'cancelled';

              await playPromise;
              if (this.playId !== currentPlayId) return 'cancelled';
              audio.volume = 1;
              
              return new Promise((resolve) => {
                const playback = {
                  audio,
                  monitorId: null,
                  handleEnded: null,
                  handleTimeUpdate: null,
                  resolve,
                  settled: false
                };

                const finish = (status) => {
                  if (playback.settled) return;
                  playback.settled = true;
                  clearInterval(playback.monitorId);
                  audio.removeEventListener('ended', playback.handleEnded);
                  audio.removeEventListener('timeupdate', playback.handleTimeUpdate);

                  if (this.activePlayback === playback) {
                    this.activePlayback = null;
                  }
                  if (status === 'completed' && this.playId === currentPlayId) {
                    audio.pause();
                  }
                  resolve(status);
                };

                const checkBoundary = () => {
                  if (this.activePlayback !== playback) return;
                  if (audio.currentTime >= actualEnd) finish('completed');
                };

                playback.handleEnded = () => finish('completed');
                playback.handleTimeUpdate = checkBoundary;
                audio.addEventListener('ended', playback.handleEnded, { once: true });
                audio.addEventListener('timeupdate', playback.handleTimeUpdate);
                playback.monitorId = setInterval(checkBoundary, this.monitorIntervalMs);

                this.activePlayback = playback;
              });
            } catch(e) {
              if (this.playId !== currentPlayId) return 'cancelled';
              console.error("Audio play error", e);
              return 'unavailable';
            }
          }
        };

        let phrasePlaybackId = 0;

        // 发音按钮点击
        async function speakPhrase(text, originalAudioOnly = false) {
            const cleanText = text.trim();
            if (!cleanText) return;
            const currentRequestId = ++phrasePlaybackId;
            NCEAudio.cancel();

            // 停止之前的音频
            if (window.currentAudio) {
                window.currentAudio.pause();
                window.currentAudio = null;
            }
            if (window.audioTimeout) {
                clearTimeout(window.audioTimeout);
            }
            // 取消之前的 speechSynthesis
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }

            const lessonNum = typeof favoritesMode !== 'undefined' && favoritesMode && favoriteSentences && favoriteSentences[currentIndex] 
                ? favoriteSentences[currentIndex].lesson 
                : currentLesson;

            const playbackStatus = await NCEAudio.playSentence(text, lessonNum);
            if (phrasePlaybackId !== currentRequestId) return;
            if (playbackStatus !== 'unavailable') return;
            if (originalAudioOnly) {
                showToast('原声音频暂时无法播放，请稍后再试', 'wrong');
                return;
            }

            // 多个TTS源，按优先级尝试
            const ttsUrls = [
                `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(cleanText)}&type=1`,
                `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(cleanText)}&type=2`,
            ];

            let currentTtsIndex = 0;
            let resolved = false;

            function tryNextTTS() {
                if (resolved || phrasePlaybackId !== currentRequestId) return;

                // 所有URL都试完了，使用浏览器内置 speechSynthesis 作为最终兜底
                if (currentTtsIndex >= ttsUrls.length) {
                    resolved = true;
                    speakWithBrowserTTS(cleanText, currentRequestId);
                    return;
                }

                const url = ttsUrls[currentTtsIndex];
                currentTtsIndex++;

                const audio = new Audio();
                window.currentAudio = audio;

                // 超时计时器
                const timeout = setTimeout(() => {
                    if (!resolved && phrasePlaybackId === currentRequestId) {
                        audio.pause();
                        audio.src = '';
                        tryNextTTS();
                    }
                }, 3000);

                audio.onloadeddata = () => {
                    if (phrasePlaybackId !== currentRequestId) {
                        clearTimeout(timeout);
                        audio.pause();
                        return;
                    }

                    // 检查音频是否有实际内容（有些API返回空音频）
                    if (audio.duration > 0.1) {
                        clearTimeout(timeout);
                        resolved = true;
                        audio.play().catch(() => {
                            resolved = false;
                            tryNextTTS();
                        });
                    } else {
                        clearTimeout(timeout);
                        audio.pause();
                        tryNextTTS();
                    }
                };

                audio.onerror = () => {
                    clearTimeout(timeout);
                    if (phrasePlaybackId !== currentRequestId) return;
                    tryNextTTS();
                };

                audio.src = url;
                audio.load();
            }

            tryNextTTS();
        }

        // 使用浏览器内置 Web Speech API 作为最终备选
        function speakWithBrowserTTS(text, requestId = phrasePlaybackId) {
            if (!window.speechSynthesis || requestId !== phrasePlaybackId) {
                console.log('浏览器不支持 speechSynthesis');
                return;
            }
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        // 获取拖拽时应插入的目标元素
        function getDragAfterElement(container, x, y) {
            const draggableElements = [...container.querySelectorAll('.word:not(.dragging)')];
            for (const child of draggableElements) {
                const box = child.getBoundingClientRect();
                if (y < box.bottom) {
                    if (y > box.top) {
                        if (x < box.left + box.width / 2) return child;
                    } else {
                        return child;
                    }
                }
            }
            return null;
        }

        // 设置拖拽事件
        function setupDragAndDrop() {
            const dropZone = document.getElementById('dropZone');
            const wordPool = document.getElementById('wordPool');

            document.addEventListener('dragstart', (e) => {
                if (e.target.classList.contains('word')) {
                    draggedWord = e.target;
                    e.target.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                }
            });

            document.addEventListener('dragend', (e) => {
                if (e.target.classList.contains('word')) {
                    e.target.classList.remove('dragging');
                    draggedWord = null;
                }
            });

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('drag-over');
                
                if (draggedWord) {
                    const placeholder = dropZone.querySelector('span[style*="italic"]');
                    if (placeholder) placeholder.remove();

                    draggedWord.classList.add('in-zone');
                    
                    const afterElement = getDragAfterElement(dropZone, e.clientX, e.clientY);
                    if (afterElement) {
                        dropZone.insertBefore(draggedWord, afterElement);
                    } else {
                        dropZone.appendChild(draggedWord);
                    }
                }
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('drag-over');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');

                if (draggedWord) {
                    draggedWord.classList.add('in-zone');
                    // 单词位置已经在 dragover 中实时调整好了
                }
            });

            wordPool.addEventListener('dragover', (e) => {
                e.preventDefault();
            });

            wordPool.addEventListener('drop', (e) => {
                e.preventDefault();
                if (draggedWord && draggedWord.classList.contains('in-zone')) {
                    draggedWord.classList.remove('in-zone');
                    wordPool.appendChild(draggedWord);

                    const dropZone = document.getElementById('dropZone');
                    if (dropZone.querySelectorAll('.word').length === 0) {
                        dropZone.innerHTML = '<span style="color: #9ca3af; font-style: italic;">将单词拖到这里...</span>';
                    }
                }
            });

            // 点击交互（移动端支持）
            document.addEventListener('click', (e) => {
                if (e.target.classList.contains('word')) {
                    const word = e.target;
                    const dropZone = document.getElementById('dropZone');
                    const wordPool = document.getElementById('wordPool');

                    if (word.classList.contains('in-zone')) {
                        word.classList.remove('in-zone');
                        wordPool.appendChild(word);

                        if (dropZone.querySelectorAll('.word').length === 0) {
                            dropZone.innerHTML = '<span style="color: #9ca3af; font-style: italic;">将单词拖到这里...</span>';
                        }
                    } else {
                        const placeholder = dropZone.querySelector('span[style*="italic"]');
                        if (placeholder) placeholder.remove();

                        word.classList.add('in-zone');
                        dropZone.appendChild(word);
                    }
                }
            });
        }
